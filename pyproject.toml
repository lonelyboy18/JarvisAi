[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["luna_core"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["frontend", "tests"]
